<!DOCTYPE html>
{% load static %}
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Drive - SAÉ 2.03</title>
    <link rel="stylesheet" href="{% static 'sae_app/style.css' %}">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        nav a { margin-right: 15px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn { padding: 5px 10px; margin: 2px; text-decoration: none; }
        .btn-add { background: green; color: white; }
        .btn-edit { background: orange; color: white; }
        .btn-delete { background: red; color: white; }
    </style>
</head>
<body>
    <nav>
        <a href="/produits/">Produits</a>
        <a href="/clients/">Clients</a>
        <a href="/commandes/">Commandes</a>
        <a href="/categories/">Catégories</a>
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
