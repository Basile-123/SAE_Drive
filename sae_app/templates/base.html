<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Drive — SAÉ 2.03</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #2563eb;
            --bg: #fafafa;
            --surface: #ffffff;
            --border: #e5e7eb;
            --text: #111827;
            --muted: #6b7280;
            --danger: #dc2626;
            --warning: #d97706;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; }
        header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 48px; display: flex; align-items: center; height: 56px; gap: 32px; }
        .logo { font-weight: 500; font-size: 15px; color: var(--accent); }
        nav { display: flex; gap: 4px; }
        nav a { font-size: 14px; color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 6px; transition: all 0.15s; }
        nav a:hover { color: var(--text); background: var(--bg); }
        .container { max-width: 1100px; margin: 40px auto; padding: 0 48px; }
        h1 { font-size: 20px; font-weight: 500; margin-bottom: 20px; letter-spacing: -0.4px; }
        .btn { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; padding: 6px 14px; border-radius: 6px; text-decoration: none; border: none; cursor: pointer; transition: all 0.15s; display: inline-block; }
        .btn-add { background: var(--accent); color: white; margin-bottom: 20px; padding: 8px 18px; }
        .btn-add:hover { background: #1d4ed8; }
        .btn-edit { background: #fef3c7; color: var(--warning); margin-right: 4px; }
        .btn-edit:hover { background: #fde68a; }
        .btn-delete { background: #fee2e2; color: var(--danger); }
        .btn-delete:hover { background: #fecaca; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; padding: 12px 20px; text-align: left; background: var(--bg); border-bottom: 1px solid var(--border); }
        td { padding: 13px 20px; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--text); }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f9fafb; }
        .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 32px; max-width: 520px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 9px 13px; border: 1px solid var(--border); border-radius: 7px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text); background: var(--surface); outline: none; transition: border-color 0.15s; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
        .form-group textarea { height: 88px; resize: vertical; }
        .form-actions { display: flex; gap: 10px; margin-top: 24px; }
        .btn-submit { background: var(--accent); color: white; border: none; padding: 10px 22px; border-radius: 7px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; }
        .btn-submit:hover { background: #1d4ed8; }
        .btn-cancel { background: var(--bg); color: var(--muted); border: 1px solid var(--border); padding: 10px 22px; border-radius: 7px; font-size: 14px; text-decoration: none; }
        .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 40px; }
        @media print {
            header, nav, .btn-add, .btn-edit, .btn-delete, .btn-cancel, button { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <span class="logo">Drive</span>
        <nav>
            <a href="/produits/">Produits</a>
            <a href="/clients/">Clients</a>
            <a href="/commandes/">Commandes</a>
            <a href="/categories/">Catégories</a>
        </nav>
    </header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
