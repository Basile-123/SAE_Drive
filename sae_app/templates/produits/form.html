{% extends 'base.html' %}
{% block content %}
<h1>{% if produit %}Modifier{% else %}Ajouter{% endif %} un produit</h1>
<div class="form-card">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Nom</label>
            <input type="text" name="nom" value="{{ produit.nom }}" required>
        </div>
        <div class="form-group">
            <label>Marque</label>
            <input type="text" name="marque" value="{{ produit.marque }}">
        </div>
        <div class="form-group">
            <label>Prix (€)</label>
            <input type="number" step="0.01" name="prix" value="{{ produit.prix }}" required>
        </div>
        <div class="form-group">
            <label>Date de péremption</label>
            <input type="date" name="date_peremption" value="{{ produit.date_peremption }}">
        </div>
        <div class="form-group">
            <label>Catégorie</label>
            <select name="categorie">
                {% for cat in categories %}
                <option value="{{ cat.pk }}" {% if produit.categorie == cat %}selected{% endif %}>
                    {{ cat.nom }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-submit">Enregistrer</button>
            <a href="/produits/" class="btn-cancel">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
