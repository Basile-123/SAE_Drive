{% extends 'base.html' %}

{% block content %}
<h1>{% if produit %}Modifier{% else %}Ajouter{% endif %} un produit</h1>

<form method="post">
    {% csrf_token %}
    <table>
        <tr>
            <td>Nom</td>
            <td><input type="text" name="nom" value="{{ produit.nom }}" required></td>
        </tr>
        <tr>
            <td>Marque</td>
            <td><input type="text" name="marque" value="{{ produit.marque }}"></td>
        </tr>
        <tr>
            <td>Prix</td>
            <td><input type="number" step="0.01" name="prix" value="{{ produit.prix }}" required></td>
        </tr>
        <tr>
            <td>Date de péremption</td>
            <td><input type="date" name="date_peremption" value="{{ produit.date_peremption }}"></td>
        </tr>
        <tr>
            <td>Catégorie</td>
            <td>
                <select name="categorie">
                    {% for cat in categories %}
                    <option value="{{ cat.pk }}" {% if produit.categorie == cat %}selected{% endif %}>
                        {{ cat.nom }}
                    </option>
                    {% endfor %}
                </select>
            </td>
        </tr>
    </table>
    <br>
    <button type="submit">Enregistrer</button>
    <a href="/produits/">Annuler</a>
</form>
{% endblock %}
