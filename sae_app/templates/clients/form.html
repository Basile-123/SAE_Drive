{% extends 'base.html' %}
{% block content %}
<h1>{% if client %}Modifier{% else %}Ajouter{% endif %} un client</h1>
<div class="form-card">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Nom</label>
            <input type="text" name="nom" value="{{ client.nom }}" required>
        </div>
        <div class="form-group">
            <label>Prénom</label>
            <input type="text" name="prenom" value="{{ client.prenom }}" required>
        </div>
        <div class="form-group">
            <label>Adresse</label>
            <textarea name="adresse">{{ client.adresse }}</textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-submit">Enregistrer</button>
            <a href="/clients/" class="btn-cancel">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
