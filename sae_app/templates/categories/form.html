{% extends 'base.html' %}
{% block content %}
<h1>{% if categorie %}Modifier{% else %}Ajouter{% endif %} une catégorie</h1>
<div class="form-card">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Nom</label>
            <input type="text" name="nom" value="{{ categorie.nom }}" required>
        </div>
        <div class="form-group">
            <label>Descriptif</label>
            <textarea name="descriptif">{{ categorie.descriptif }}</textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-submit">Enregistrer</button>
            <a href="/categories/" class="btn-cancel">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
