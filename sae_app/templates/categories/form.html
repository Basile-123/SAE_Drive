<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="{% static 'sae_app/style.css' %}">

</head>
<body>
{% extends 'base.html' %}

{% block content %}
<h1>{% if categorie %}Modifier{% else %}Ajouter{% endif %} une catégorie</h1>

<form method="post">
    {% csrf_token %}

    <table>
        <tr>
            <td>Nom</td>
            <td>
                <input type="text" name="nom" value="{{ categorie.nom }}" required>
            </td>
        </tr>

        <tr>
            <td>Descriptif</td>
            <td>
                <textarea name="descriptif">{{ categorie.descriptif }}</textarea>
            </td>
        </tr>
    </table>

    <br>

    <button type="submit">Enregistrer</button>
    <a href="/categories/">Annuler</a>
</form>
{% endblock %}
</body>
</html>
